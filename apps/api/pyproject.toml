[project]
name = "booklantern"
version = "1.0.1"
description = "Booklantern: finance back office for a small business"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "sendora-core",
  "alembic>=1.14",
  "cryptography>=43",
  "uvicorn>=0.30",
  "reportlab>=5.1",
  "pillow>=13",
  "pypdfium2>=5.15",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["psycopg[binary]>=3.2", "pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booklantern"]

[tool.coverage.run]
source = ["src/booklantern"]
